# ARGUS - pinned direct dependencies.
#
# requirements.txt lists what ARGUS needs; this file records the versions this
# install was built and tested against. Every entry in requirements.txt was
# unpinned, which means two installs from the same source can differ in every
# library, and a compromised release of any of them arrives silently on the
# next `pip install`.
#
# Regenerate deliberately, after testing an upgrade:
#     python tools/lock_deps.py
#
# Verify what is installed against it:
#     python -c "import plugins; print(plugins.check_dependencies())"
#
# Direct dependencies only. The full transitive set is 87 packages; pinning
# those belongs in a proper lock (pip-tools / uv) rather than a hand-kept
# file that would go stale and be trusted anyway.

